<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Results - Mock Interviewer</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .summary-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
    }

    .summary-left h2 {
      font-size: 18px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .summary-left .meta {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 6px;
    }

    .summary-left .date-text {
      font-size: 13px;
      color: #94a3b8;
    }

    .summary-right {
      text-align: center;
    }

    .big-score {
      font-size: 42px;
      font-weight: 700;
      line-height: 1;
    }

    .big-score-label {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .mini-stats {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }

    .mini-stat {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 10px 16px;
      text-align: center;
      min-width: 90px;
    }

    .mini-stat .mn {
      font-size: 20px;
      font-weight: 700;
      color: #2563eb;
    }

    .mini-stat .ml {
      font-size: 11px;
      color: #94a3b8;
      text-transform: uppercase;
      font-weight: 600;
    }

    /* collapsible Q&A cards */
    .qa-section-title {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 14px;
    }

    .qa-card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      margin-bottom: 12px;
      overflow: hidden;
    }

    .qa-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s;
    }

    .qa-header:hover {
      background: #f8fafc;
    }

    .qa-header-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
    }

    .q-num-circle {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #eff6ff;
      color: #2563eb;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .q-preview {
      font-size: 14px;
      color: #334155;
      flex: 1;
    }

    .qa-header-right {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .toggle-arrow {
      font-size: 12px;
      color: #94a3b8;
      transition: transform 0.2s;
    }

    .qa-card.open .toggle-arrow {
      transform: rotate(180deg);
    }

    .qa-body {
      display: none;
      padding: 0 18px 18px;
      border-top: 1px solid #f1f5f9;
    }

    .qa-card.open .qa-body {
      display: block;
    }

    .qa-section {
      margin-top: 14px;
    }

    .qa-section-lbl {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 6px;
    }

    .lbl-q { color: #2563eb; }
    .lbl-a { color: #16a34a; }
    .lbl-f { color: #7c3aed; }

    .qa-content {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 14px;
      color: #334155;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .no-answer-note {
      font-size: 13px;
      color: #94a3b8;
      font-style: italic;
    }

    .bottom-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 28px;
      padding-bottom: 30px;
    }

    @media (max-width: 560px) {
      .summary-card { flex-direction: column; }
      .mini-stats   { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

<!-- Navbar -->
<div class="navbar">
  <div class="logo">Mock<span>AI</span></div>
  <div class="nav-right">
    <button class="btn btn-outline btn-sm" onclick="window.location.href='dashboard.html'">← Dashboard</button>
  </div>
</div>

<div class="page-wrap">

  <div id="loading-area" class="empty-state">
    <span class="spinner"></span> &nbsp; Loading results...
  </div>

  <div id="results-area" style="display:none;">

    <!-- Summary -->
    <div class="summary-card" id="summary-card">
      <!-- filled by JS -->
    </div>

    <!-- Mini stats -->
    <div class="mini-stats mb-16" id="mini-stats">
      <!-- filled by JS -->
    </div>

    <!-- Q&A review -->
    <div class="qa-section-title">Question &amp; Answer Review</div>
    <div id="qa-list">
      <!-- filled by JS -->
    </div>

    <div class="bottom-actions">
      <button class="btn btn-primary" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
      <button class="btn btn-outline" onclick="window.location.href='dashboard.html'">Practice Again</button>
    </div>

  </div>

</div>

<script src="../js/helper.js"></script>
<script>
  if (!requireAuth()) { throw new Error(); }

  // get session id from URL  ?id=123
  var params    = new URLSearchParams(window.location.search);
  var sessionId = params.get('id');

  if (!sessionId) {
    window.location.href = 'dashboard.html';
  }

  loadResults();

  async function loadResults() {
    try {
      var data = await apiCall('/interview/session/' + sessionId);
      renderResults(data.session, data.questions);
    } catch (err) {
      document.getElementById('loading-area').innerHTML =
        '<div class="empty-state">Could not load results: ' + err.message + '</div>';
    }
  }

  function renderResults(session, questions) {
    document.getElementById('loading-area').style.display = 'none';
    document.getElementById('results-area').style.display = 'block';

    var score      = parseFloat(session.score || 0).toFixed(1);
    var scoreColor = getScoreColor(score);
    var diffCls    = getDiffTag(session.difficulty);
    var answered   = questions.filter(function(q) { return !!q.answer_text; });

    // summary card
    document.getElementById('summary-card').innerHTML =
      '<div class="summary-left">' +
        '<h2>' + session.job_role + ' Interview</h2>' +
        '<div class="meta">' +
          '<span class="tag ' + diffCls + '">' + session.difficulty + '</span>' +
          '<span class="tag ' + (session.status === 'completed' ? 'tag-green' : 'tag-blue') + '">' + session.status + '</span>' +
        '</div>' +
        '<div class="date-text">Started: ' + niceDate(session.started_at) + '</div>' +
        (session.ended_at ? '<div class="date-text">Ended: ' + niceDate(session.ended_at) + '</div>' : '') +
      '</div>' +
      '<div class="summary-right">' +
        '<div class="big-score" style="color:' + scoreColor + '">' + score + '</div>' +
        '<div class="big-score-label">Out of 10</div>' +
      '</div>';

    // mini stats
    document.getElementById('mini-stats').innerHTML =
      '<div class="mini-stat"><div class="mn">' + questions.length + '</div><div class="ml">Questions</div></div>' +
      '<div class="mini-stat"><div class="mn">' + answered.length + '</div><div class="ml">Answered</div></div>' +
      '<div class="mini-stat"><div class="mn">' + (questions.length - answered.length) + '</div><div class="ml">Skipped</div></div>';

    // Q&A cards
    var html = '';
    questions.forEach(function(q, idx) {
      var hasAnswer  = !!q.answer_text;
      var qScore     = hasAnswer ? parseFloat(q.ans_score || 0).toFixed(1) : null;
      var qColor     = qScore ? getScoreColor(qScore) : '#94a3b8';
      var preview    = q.question_text.length > 70 ? q.question_text.substring(0, 70) + '...' : q.question_text;

      html += '<div class="qa-card" id="qa-' + idx + '">' +
        '<div class="qa-header" onclick="toggleQA(' + idx + ')">' +
          '<div class="qa-header-left">' +
            '<div class="q-num-circle">' + q.q_number + '</div>' +
            '<div class="q-preview">' + preview + '</div>' +
          '</div>' +
          '<div class="qa-header-right">' +
            (qScore
              ? '<span style="font-weight:700;font-size:14px;color:' + qColor + '">' + qScore + '/10</span>'
              : '<span class="tag tag-gray">Skipped</span>'
            ) +
            '<span class="toggle-arrow">▼</span>' +
          '</div>' +
        '</div>' +

        '<div class="qa-body">' +
          '<div class="qa-section">' +
            '<div class="qa-section-lbl lbl-q">Question</div>' +
            '<div class="qa-content">' + q.question_text + '</div>' +
          '</div>' +

          (hasAnswer
            ? '<div class="qa-section">' +
                '<div class="qa-section-lbl lbl-a">Your Answer</div>' +
                '<div class="qa-content">' + q.answer_text + '</div>' +
              '</div>' +
              '<div class="qa-section">' +
                '<div class="qa-section-lbl lbl-f">AI Feedback</div>' +
                '<div class="qa-content">' + (q.feedback || 'No feedback saved.') + '</div>' +
              '</div>'
            : '<div class="qa-section"><p class="no-answer-note">This question was skipped.</p></div>'
          ) +
        '</div>' +
      '</div>';
    });

    document.getElementById('qa-list').innerHTML = html;
  }

  function toggleQA(idx) {
    var card = document.getElementById('qa-' + idx);
    card.classList.toggle('open');
  }
</script>
</body>
</html>
